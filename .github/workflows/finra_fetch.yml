name: FINRA fetch to Supabase

on:
  # If legacy branch publishing is enabled, restore the database-backed artifact
  # after its template build. Custom deploy-pages runs do not trigger this event.
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 14 * * 1-5" # UTC; poll weekdays for new files and recent revisions
  workflow_dispatch:
    inputs:
      backfill:
        description: "Load every known settlement date"
        type: boolean
        default: false
      refresh:
        description: "Reload historical periods too (use with backfill)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: finra-supabase-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKFILL: ${{ inputs.backfill }}
      REFRESH: ${{ inputs.refresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check database secret
        run: test -n "$SUPABASE_DB_URL" || { echo 'Missing SUPABASE_DB_URL repository secret'; exit 1; }
      - run: pip install -r requirements-finra.txt
      - run: python -m unittest discover -s tests -p 'test_finra_supabase.py'
      - name: Ingest FINRA
        shell: bash
        run: |
          args=()
          if [[ "$BACKFILL" == 'true' ]]; then args+=(--backfill); fi
          if [[ "$REFRESH" == 'true' ]]; then args+=(--refresh); fi
          python ingest_finra_supabase.py "${args[@]}"

  build:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-finra.txt
      - run: python -m unittest discover -s tests
      - name: Build and validate dashboard from Supabase
        run: python publish_finra_dashboard.py --output-dir site
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
